<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Llegada de Valery 📖💖</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #fcf9f2; }
        .font-cuento { font-family: 'Lora', serif; }
        .libro-shadow { box-shadow: 15px 15px 30px #e0dbce, -15px -15px 30px #ffffff; }
    </style>
</head>
<body class="min-h-screen bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')] flex flex-col items-center py-10 px-4">

    <!-- CONTENEDOR PRINCIPAL (Estilo Libro) -->
    <div class="max-w-4xl w-full bg-white rounded-r-3xl rounded-l-md border-l-8 border-pink-400 p-8 md:p-12 libro-shadow relative">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-cuento font-bold text-pink-600 mb-2">La Llegada de Valery</h1>
            <p class="text-lg text-gray-500 italic">¿Qué día llenará de alegría nuestro hogar?</p>
        </div>

        <!-- FORMULARIO DE APUESTAS -->
        <div class="bg-pink-50 p-6 rounded-2xl border border-pink-100 mb-10">
            <form id="form-apuesta" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tu Nombre</label>
                    <input type="text" id="nombre" required class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none" placeholder="Ej. Tía María">
                </div>
                <div class="w-full">
                    <label class="block text-sm font-bold text-gray-700 mb-1">¿Qué día crees que llegará?</label>
                    <input type="date" id="fecha" required min="2026-10-15" max="2026-12-31" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none">
                </div>
                <div class="w-full">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tu Ícono</label>
                    <select id="icono" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none text-xl">
                        <option value="👣">👣 Huellitas</option>
                        <option value="🍼">🍼 Biberón</option>
                        <option value="🐈">🐈 Gatita Mila </option>
                        <option value="🐾">🐈‍⬛ Gatita Niki </option>
                        <option value="⭐">⭐ Estrella Mágica</option>
                        <option value="🧸">🧸 Osito</option>
                    </select>
                </div>
                <button type="submit" class="w-full md:w-auto bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md transform hover:scale-105">
                    ¡Adivinar!
                </button>
            </form>
        </div>

        <!-- TABLERO DE APUESTAS -->
        <h3 class="text-2xl font-cuento font-bold text-gray-700 mb-6 border-b-2 border-pink-100 pb-2">Las Predicciones de la Familia</h3>
        <div id="tablero" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <!-- Las apuestas aparecerán aquí en tiempo real -->
        </div>

        <!-- SECCIÓN SECRETA DE REVELACIÓN (Oculta por defecto) -->
        <div id="seccion-revelacion" class="hidden transform transition-all duration-700 scale-95 opacity-0">
            
            <!-- Ganador -->
            <div class="bg-gradient-to-r from-pink-400 to-purple-500 rounded-3xl p-8 text-center text-white shadow-2xl mb-8 border-4 border-white">
                <h2 class="text-5xl font-bold font-cuento mb-4">¡ES OFICIAL! 🎉</h2>
                <p class="text-2xl mb-6">Valery estará en nuestro hogar el <span class="font-black text-yellow-300">27 de Noviembre</span></p>
                <div id="resultado-ganador" class="bg-white/20 p-4 rounded-xl text-xl backdrop-blur-sm">
                    <!-- Mensaje del ganador se inyecta aquí -->
                </div>
            </div>

            <!-- Contador -->
            <div id="contador-valery" class="text-center p-6 bg-white/80 rounded-2xl border-4 border-pink-300 shadow-xl">
                <h2 class="text-2xl font-extrabold text-gray-700 mb-4 font-cuento">Tiempo exacto para abrazar a Valery:</h2>
                <div class="flex justify-center gap-4 text-pink-500 font-bold">
                    <div class="flex flex-col items-center bg-pink-50 rounded-lg p-3 w-24 shadow-inner">
                        <span id="dias" class="text-4xl md:text-5xl">00</span>
                        <span class="text-sm text-gray-500 uppercase tracking-wide">Días</span>
                    </div>
                    <span class="text-3xl mt-3">:</span>
                    <div class="flex flex-col items-center bg-pink-50 rounded-lg p-3 w-20 shadow-inner">
                        <span id="horas" class="text-3xl md:text-4xl">00</span>
                        <span class="text-xs text-gray-500 uppercase tracking-wide">Hrs</span>
                    </div>
                    <span class="text-3xl mt-3">:</span>
                    <div class="flex flex-col items-center bg-pink-50 rounded-lg p-3 w-20 shadow-inner">
                        <span id="minutos" class="text-3xl md:text-4xl">00</span>
                        <span class="text-xs text-gray-500 uppercase tracking-wide">Min</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE Y LÓGICA JAVASCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // ==========================================
        // ⚠️ PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ⚠️
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const apuestasRef = collection(db, "apuestas");

        let todasLasApuestas = [];
        const fechaRealLlegada = '2026-11-27';

        const q = query(apuestasRef, orderBy("fechaString"));
        onSnapshot(q, (snapshot) => {
            const tablero = document.getElementById('tablero');
            tablero.innerHTML = '';
            todasLasApuestas = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                todasLasApuestas.push(data);

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow border border-gray-100 flex flex-col items-center text-center transform transition-all hover:-translate-y-1";
                card.innerHTML = `
                    <div class="text-4xl mb-2">${data.icono}</div>
                    <div class="font-bold text-gray-800">${data.nombre}</div>
                    <div class="text-sm text-pink-500 font-bold bg-pink-50 px-2 py-1 rounded mt-1">${formatearFecha(data.fechaString)}</div>
                `;
                tablero.appendChild(card);
            });
        });

        document.getElementById('form-apuesta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const fechaString = document.getElementById('fecha').value;
            const icono = document.getElementById('icono').value;

            try {
                await addDoc(apuestasRef, { nombre, fechaString, icono });
                document.getElementById('form-apuesta').reset();
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar. Revisa la consola.");
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'V' || event.key === 'v') {
                revelarGranSecreto();
            }
        });

        function revelarGranSecreto() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            const objetivo = new Date(fechaRealLlegada + 'T00:00:00');
            let apuestasCalculadas = todasLasApuestas.map(a => {
                const fechaApostada = new Date(a.fechaString + 'T00:00:00');
                const diffDias = Math.ceil(Math.abs(objetivo - fechaApostada) / (1000 * 60 * 60 * 24));
                return { ...a, diffDias };
            });

            const minDiff = Math.min(...apuestasCalculadas.map(a => a.diffDias));
            const ganadores = apuestasCalculadas.filter(a => a.diffDias === minDiff);
            const textoGanador = ganadores.map(g => `${g.icono} ${g.nombre}`).join(' y ');

            const msj = minDiff === 0 
                ? `¡Increíble! 🏆 ${textoGanador} acertó la fecha EXACTA.` 
                : `🏆 Más cerca: ${textoGanador} (Diferencia de solo ${minDiff} días)`;
            
            document.getElementById('resultado-ganador').innerHTML = msj;

            const seccionRev = document.getElementById('seccion-revelacion');
            seccionRev.classList.remove('hidden');
            setTimeout(() => {
                seccionRev.classList.remove('scale-95', 'opacity-0');
                seccionRev.classList.add('scale-100', 'opacity-100');
            }, 50);

            iniciarContador();
            document.getElementById('form-apuesta').parentElement.style.display = 'none';
        }

        function iniciarContador() {
            const msLlegada = new Date(fechaRealLlegada + 'T00:00:00').getTime();
            setInterval(() => {
                const ahora = new Date().getTime();
                const distancia = msLlegada - ahora;

                if (distancia < 0) {
                    document.getElementById('contador-valery').innerHTML = "<h2 class='text-4xl font-bold text-pink-600 animate-bounce p-8'>¡VALERY YA ESTÁ EN CASA! 🏡💖</h2>";
                    return;
                }

                document.getElementById('dias').innerText = Math.floor(distancia / (1000 * 60 * 60 * 24));
                let hrs = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let mns = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
                
                document.getElementById('horas').innerText = hrs < 10 ? '0' + hrs : hrs;
                document.getElementById('minutos').innerText = mns < 10 ? '0' + mns : mns;
            }, 1000);
        }

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }
        function formatearFecha(fechaStr) {
            const partes = fechaStr.split('-');
            const f = new Date(partes[0], partes[1] - 1, partes[2]);
            return f.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }
    </script>
</body>
</html>
