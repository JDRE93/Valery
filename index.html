<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Llegada de Valery 📖💖</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #fcf9f2; }
        .font-cuento { font-family: 'Lora', serif; }
        .libro-shadow { box-shadow: 15px 15px 30px #e0dbce, -15px -15px 30px #ffffff; }
    </style>
</head>
<body class="min-h-screen bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')] flex flex-col items-center py-10 px-4">

    <!-- CONTENEDOR PRINCIPAL (Estilo Libro) -->
    <div class="max-w-4xl w-full bg-white rounded-r-3xl rounded-l-md border-l-8 border-pink-400 p-8 md:p-12 libro-shadow relative">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-cuento font-bold text-pink-600 mb-2">La Llegada de Valery</h1>
            <p class="text-lg text-gray-500 italic">¿Qué día llenará de alegría nuestro hogar?</p>
        </div>

        <!-- FORMULARIO DE APUESTAS -->
        <div class="bg-pink-50 p-6 rounded-2xl border border-pink-100 mb-10">
            <form id="form-apuesta" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tu Nombre</label>
                    <input type="text" id="nombre" required class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none" placeholder="Ej. Tía María">
                </div>
                <div class="w-full">
                    <label class="block text-sm font-bold text-gray-700 mb-1">¿Qué día crees que llegará?</label>
                    <!-- Rango abierto desde hoy 9 de Octubre -->
                    <input type="date" id="fecha" required min="2026-10-09" max="2026-12-31" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none">
                </div>
                <div class="w-full">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tu Ícono</label>
                    <select id="icono" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none text-xl">
                        <!-- Los tiernos y Clásicos -->
                        <option value="👶">👶 </option>
                        <option value="👣">👣 </option>
                        <option value="🍼">🍼 </option>
                        <option value="🧸">🧸 </option>
                        <option value="⭐">⭐ </option>
                        
                        <!-- Las dueñas de la casa -->
                        <option value="🐈">🐈</option>
                        <option value="🐾">🐾 </option>
                        
                        <!-- La Familia (Humanos) -->
                        <option value="💃">💃 Tía </option>
                        <option value="👵">👵 Abuela</option>
                        <option value="🕶️">🕶️ Tío</option>
                        <option value="👴">👴 Abuelo</option>
                        <option value="🎮">🎮 Primo</option>
                        <option value="💅">💅 Prima</option>
                                               
                    </select>
                </div>
                <button type="submit" class="w-full md:w-auto bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md transform hover:scale-105">
                    ¡Adivinar!
                </button>
            </form>
        </div>

        <!-- TABLERO DE APUESTAS -->
        <h3 class="text-2xl font-cuento font-bold text-gray-700 mb-6 border-b-2 border-pink-100 pb-2">Las Predicciones de la Familia</h3>
        <div id="tablero" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <!-- Las apuestas aparecerán aquí en tiempo real -->
        </div>

        <!-- SECCIÓN SECRETA DE REVELACIÓN (Seguridad Extrema: Oculta a la fuerza) -->
        <div id="seccion-revelacion" style="display: none;" class="transform transition-all duration-700 scale-95 opacity-0">
            
            <!-- Ganador -->
            <div class="bg-gradient-to-r from-pink-400 to-purple-500 rounded-3xl p-8 text-center text-white shadow-2xl mb-8 border-4 border-white">
                <h2 class="text-5xl font-bold font-cuento mb-4">¡ES OFICIAL! 🎉</h2>
                <!-- El texto oficial está vacío para evitar filtraciones en el código -->
                <p id="texto-oficial" class="text-2xl mb-6"></p>
                
                <div id="resultado-ganador" class="bg-white/20 p-4 rounded-xl text-xl backdrop-blur-sm">
                    <!-- Mensaje del ganador se inyecta aquí -->
                </div>
            </div>

            <!-- Contador -->
            <div id="contador-valery" class="text-center p-6 bg-white/80 rounded-2xl border-4 border-pink-300 shadow-xl">
                <h2 class="text-2xl font-extrabold text-gray-700 mb-4 font-cuento">Tiempo exacto para abrazar a Valery:</h2>
                <div class="flex justify-center gap-4 text-pink-500 font-bold">
                    <div class="flex flex-col items-center bg-pink-50 rounded-lg p-3 w-24 shadow-inner">
                        <span id="dias" class="text-4xl md:text-5xl">00</span>
                        <span class="text-sm text-gray-500 uppercase tracking-wide">Días</span>
                    </div>
                    <span class="text-3xl mt-3">:</span>
                    <div class="flex flex-col items-center bg-pink-50 rounded-lg p-3 w-20 shadow-inner">
                        <span id="horas" class="text-3xl md:text-4xl">00</span>
                        <span class="text-xs text-gray-500 uppercase tracking-wide">Hrs</span>
                    </div>
                    <span class="text-3xl mt-3">:</span>
                    <div class="flex flex-col items-center bg-pink-50 rounded-lg p-3 w-20 shadow-inner">
                        <span id="minutos" class="text-3xl md:text-4xl">00</span>
                        <span class="text-xs text-gray-500 uppercase tracking-wide">Min</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

                card.innerHTML = `
